# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: summary(rhub::rhub_platforms())
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

env:
  RENV_CONFIG_AUTOLOADER_ENABLED: "false"
  RENV_AUTOLOADER_ENABLED: "false"

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - name: "[[LOG]] Environment diagnostics"
        run: |
          echo "=== R Version ==="
          R --version | head -1
          echo "=== Library paths ==="
          R -q --no-save -e '.libPaths()'
          echo "=== .Rprofile ==="
          cat .Rprofile || echo ".Rprofile not found"
          echo "=== renv.lock exists? ==="
          ls -lh renv.lock || echo "renv.lock not found"
        shell: bash
      - name: "[LOG] Bootstrap renv and restore dependencies"
        run: |
          echo "=== Installing renv ==="
          R -q --no-save -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          echo "=== renv version ==="
          R -q --no-save -e 'packageVersion("renv")'
          echo "=== Running renv::restore() ==="
          R -q --no-save -e '
            options(renv.config.auto.snapshot = FALSE)
            tryCatch(
              renv::restore(prompt = FALSE, verbose = TRUE),
              error = function(e) {
                message("renv::restore() FAILED: ", conditionMessage(e))
                quit(status = 1)
              }
            )
          '
          echo "=== Installed packages after restore ==="
          R -q --no-save -e 'as.data.frame(installed.packages()[, c("Package","Version")])'
        shell: bash
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
          needs: package
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - name: "[[LOG]] Environment diagnostics"
        run: |
          echo "=== R Version ==="
          R --version | head -1
          echo "=== Library paths ==="
          R -q --no-save -e '.libPaths()'
          echo "=== .Rprofile ==="
          cat .Rprofile || echo ".Rprofile not found"
          echo "=== renv.lock exists? ==="
          ls -lh renv.lock || echo "renv.lock not found"
        shell: bash
      - name: "[LOG] Bootstrap renv and restore dependencies"
        run: |
          echo "=== Installing renv ==="
          R -q --no-save -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          echo "=== renv version ==="
          R -q --no-save -e 'packageVersion("renv")'
          echo "=== Running renv::restore() ==="
          R -q --no-save -e '
            options(renv.config.auto.snapshot = FALSE)
            tryCatch(
              renv::restore(prompt = FALSE, verbose = TRUE),
              error = function(e) {
                message("renv::restore() FAILED: ", conditionMessage(e))
                quit(status = 1)
              }
            )
          '
          echo "=== Installed packages after restore ==="
          R -q --no-save -e 'as.data.frame(installed.packages()[, c("Package","Version")])'
        shell: bash
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
          needs: package
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
